<!DOCTYPE HTML>
<html>
	<body>
	<style>
	.My_Style {background-color: green; color: black; text-decoration: underline; font-weight: bold; font-size: small;}
	.font_1 {background-color: black; color: yellow; font-size: large;}
	.font_2 {background-color: darkblue; color: white; font-size: medium;}
	</style>
	<p class="My_Style">This element is written in custom style</p>
	<h2 class="font_1">This h2 element is styled per class attribute font_1</h2>
	<h3 class="font_2">This h3 element is styled per class attribute font_2</h3>
	<h4 class="font_1">Even though this is an h4 element, it is styled the same as the h2 element because we pointed to the class attribute font_1</h4>
	</body>
</html>
